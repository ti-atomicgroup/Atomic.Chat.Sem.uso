# Gera a imagem Docker do Atomic Chat (fork do Rocket.Chat) e publica no GitHub Container Registry.
# Dispara manualmente ou ao criar uma tag "atomic-v*" (ex.: atomic-v8.9.1-1).
name: Atomic — build da imagem

on:
  workflow_dispatch:
  push:
    tags: ["atomic-v*"]

permissions:
  contents: read
  packages: write

concurrency:
  group: atomic-build-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/atomic-chat

jobs:
  build:
    # O build do Meteor precisa de bastante RAM; o swap abaixo cobre runners de 7-8 GB.
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Swap de 8 GB
        run: |
          sudo fallocate -l 8G /swapfile2 && sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2 && sudo swapon /swapfile2 && free -h

      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"

      - name: Yarn (corepack)
        run: corepack enable && yarn --version

      - name: Cache do Meteor
        uses: actions/cache@v4
        with:
          path: ~/.meteor
          key: meteor-${{ hashFiles('apps/meteor/.meteor/release') }}

      - name: Instalar Meteor
        run: |
          command -v meteor >/dev/null || curl -sL https://install.meteor.com | sed s/--progress-bar/-sL/g | /bin/sh
          echo "$HOME/.meteor" >> "$GITHUB_PATH"

      - name: Dependências
        # A imagem é Alpine (musl), mas o build roda no Ubuntu (glibc): sem isto o yarn só baixa os
        # binários nativos glibc (sharp, swc, esbuild) e o Rocket.Chat quebra ao iniciar no container.
        run: |
          yarn config set supportedArchitectures --json '{"os": ["linux"], "cpu": ["x64"], "libc": ["glibc", "musl"]}'
          yarn install --immutable

      - name: Build dos pacotes do monorepo
        run: yarn build

      - name: Build do bundle Meteor
        working-directory: apps/meteor
        env:
          NODE_OPTIONS: --max-old-space-size=8192
        run: yarn build:ci

      - name: Manter só os binários nativos da imagem (linux musl x64)
        run: |
          NM=/tmp/dist/bundle/programs/server/npm/node_modules
          ls -d "$NM"/@img/sharp-*linuxmusl-x64 >/dev/null
          find "$NM/@img" -maxdepth 1 -type d -name 'sharp-*' -not -name '*-linuxmusl-x64' -exec rm -rf {} +
          find "$NM/@napi-rs" -maxdepth 1 -type d -name 'pinyin-linux-*' -not -name '*-linux-x64-*' -exec rm -rf {} + 2>/dev/null || true
          ls "$NM/@img"

      - name: Tag da imagem
        id: meta
        # A tag "latest" só é movida pelo job smoke-test, depois que a imagem sobe com sucesso.
        run: |
          RC_VERSION=$(jq -r .version apps/meteor/package.json)
          if [[ "$GITHUB_REF" == refs/tags/atomic-v* ]]; then TAG="${GITHUB_REF#refs/tags/atomic-v}"; else TAG="${RC_VERSION}-atomic.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build e push
        uses: docker/build-push-action@v6
        with:
          context: /tmp/dist
          file: apps/meteor/.docker/Dockerfile.alpine
          target: release-standard
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:${{ steps.meta.outputs.tag }}

    outputs:
      tag: ${{ steps.meta.outputs.tag }}

  smoke-test:
    name: Teste de fumaça da imagem
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ needs.build.outputs.tag }}
    steps:
      - name: MongoDB 8.2 (replica set)
        run: |
          docker network create smoke
          docker run -d --name mongodb --network smoke mongo:8.2 --replSet rs0 --bind_ip_all
          for _ in $(seq 1 30); do
            docker exec mongodb mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'mongodb:27017'}]}).ok" && break
            sleep 2
          done

      - name: Subir a imagem nova
        run: |
          docker run -d --name rocketchat --network smoke -p 3000:3000 \
            -e MONGO_URL="mongodb://mongodb:27017/rocketchat?replicaSet=rs0" \
            -e ROOT_URL=http://localhost:3000 \
            -e OVERWRITE_SETTING_Show_Setup_Wizard=completed \
            "$IMAGE:$TAG"

      - name: Esperar o Rocket.Chat responder
        run: |
          for _ in $(seq 1 60); do
            if INFO=$(curl -fsS http://localhost:3000/api/info 2>/dev/null); then
              echo "$INFO" | jq .
              echo "$INFO" | jq -e '.success == true' >/dev/null && exit 0
            fi
            sleep 5
          done
          echo "Rocket.Chat não respondeu em 5 minutos"
          exit 1

      - name: Logs em caso de falha
        if: failure()
        run: docker logs --tail 200 rocketchat || true

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Promover para latest
        # Branches de teste geram imagem versionada, mas só a atomic/main (ou tag de release) vira latest.
        if: github.ref == 'refs/heads/atomic/main' || startsWith(github.ref, 'refs/tags/atomic-v')
        run: docker buildx imagetools create -t "$IMAGE:latest" "$IMAGE:$TAG"
